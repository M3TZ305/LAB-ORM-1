<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="interiorWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ebe6df"/>
      <stop offset="100%" stop-color="#d6cebf"/>
    </linearGradient>
    <linearGradient id="warmWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3020"/>
      <stop offset="50%" stop-color="#734d35"/>
      <stop offset="100%" stop-color="#3c2618"/>
    </linearGradient>
  </defs>
  <!-- Neutral interior wall -->
  <rect width="800" height="500" fill="url(#interiorWall)"/>
  <!-- Tall architectural gallery window -->
  <rect x="120" y="40" width="220" height="460" fill="#f8fafc" stroke="#b0a89b" stroke-width="6"/>
  <!-- Minimalist artwork frame on wall -->
  <rect x="420" y="80" width="280" height="200" fill="#22201e"/>
  <rect x="440" y="100" width="240" height="160" fill="#faf8f5"/>
  <circle cx="560" cy="180" r="45" fill="#c2633d" opacity="0.9"/>
  <!-- Low console table -->
  <polygon points="360,400 760,400 740,360 380,360" fill="url(#warmWood)"/>
  <rect x="390" y="400" width="16" height="100" fill="#2d1c12"/>
  <rect x="710" y="400" width="16" height="100" fill="#2d1c12"/>
  <!-- Minimalist books stacked on table -->
  <rect x="430" y="340" width="110" height="20" fill="#ebe4d8" stroke="#ccc4b6"/>
  <rect x="440" y="325" width="90" height="15" fill="#3b4247"/>
  <!-- Floor line -->
  <polygon points="0,500 800,500 800,470 0,470" fill="#b8aea0"/>
</svg>
