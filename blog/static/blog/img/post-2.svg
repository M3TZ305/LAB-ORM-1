<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfd7cb"/>
      <stop offset="50%" stop-color="#cec3b3"/>
      <stop offset="100%" stop-color="#b6a895"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b85d38"/>
      <stop offset="100%" stop-color="#823c1f"/>
    </linearGradient>
    <linearGradient id="stoneLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eae4db"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#warmBg)"/>
  <!-- Arch cutout wall -->
  <path d="M80,500 L80,180 A140,140 0 0,1 360,180 L360,500 Z" fill="#9e9180" opacity="0.4"/>
  <path d="M100,500 L100,190 A120,120 0 0,1 340,190 L340,500 Z" fill="#2d2925" opacity="0.85"/>
  <!-- Minimalist Pedestal / Stone plinth -->
  <polygon points="260,500 540,500 500,320 300,320" fill="url(#stoneLight)"/>
  <polygon points="500,320 540,500 580,480 530,310" fill="#bbb0a0"/>
  <!-- Terracotta Ceramic Vessel -->
  <ellipse cx="400" cy="270" rx="60" ry="75" fill="url(#terracotta)"/>
  <ellipse cx="400" cy="205" rx="25" ry="8" fill="#582411"/>
  <!-- Olive branch / Botanical silhouette -->
  <path d="M400,205 Q430,130 520,90" stroke="#33302b" stroke-width="3" fill="none"/>
  <path d="M440,170 Q465,160 470,175 Q450,185 440,170 Z" fill="#4d473e"/>
  <path d="M470,140 Q500,130 505,145 Q485,155 470,140 Z" fill="#4d473e"/>
  <path d="M505,105 Q535,95 540,110 Q520,120 505,105 Z" fill="#4d473e"/>
  <!-- Diagonal Sunlight Shadow -->
  <polygon points="0,0 800,0 800,220 0,440" fill="#ffffff" opacity="0.12"/>
</svg>
