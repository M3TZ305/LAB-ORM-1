<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="concreteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#464b50"/>
      <stop offset="50%" stop-color="#2a2e33"/>
      <stop offset="100%" stop-color="#191c1f"/>
    </linearGradient>
    <linearGradient id="glowLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#cfc7bc"/>
    </linearGradient>
  </defs>
  <!-- Dark dramatic background -->
  <rect width="800" height="500" fill="url(#concreteBg)"/>
  <!-- Grand spiral staircase silhouette / architectural curve -->
  <path d="M100,500 C150,300 300,100 650,80 L680,130 C380,150 240,320 200,500 Z" fill="url(#glowLight)"/>
  <path d="M220,500 C250,360 360,200 620,170 L640,200 C420,230 320,360 290,500 Z" fill="#697177"/>
  <!-- Skylight / Dramatic beam -->
  <polygon points="550,0 750,0 600,450 480,450" fill="#ffffff" opacity="0.08"/>
</svg>
